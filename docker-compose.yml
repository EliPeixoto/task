version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: postgres_taskmanager
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # volume para persistência

volumes:
  postgres_data:


